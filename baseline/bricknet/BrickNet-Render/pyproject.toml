[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bricknet-render"
version = "0.1.0"
description = "Rendering for the BrickNet project"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.13"
authors = [{ name = "Peter Kulits" }]
dependencies = [
    "bpy>=5.1",
    "numpy",
    "platformdirs",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.urls]
Paper = "https://kulits.github.io/BrickNet/"

[project.scripts]
bricknet-render = "bricknet_render.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bricknet_render"]

[tool.hatch.build.targets.sdist]
include = ["src/bricknet_render", "README.md", "LICENSE", "NOTICE", "pyproject.toml"]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120
force_to_top = ["bpy"]
